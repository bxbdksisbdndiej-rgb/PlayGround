<body>
<div id="app">
 <header class="topbar"><div class="brand"><div class="brandmark">✦</div><span>DIAPER ROULETTE</span></div><div class="topright"><span>THE GREAT ERRAND DASH · SEASON 01</span><button class="sound" id="soundBtn">♫ Sound on</button></div></header>
 <main class="game">

<script>
(()=>{
const canvas=document.getElementById('world'),ctx=canvas.getContext('2d'),stage=document.getElementById('stage');
const $=id=>document.getElementById(id);const overlay=$('overlay'),modal=$('modal');
const W=2000,H=1350,TAU=Math.PI*2;let dpr=1,cw=0,ch=0,mode='intro',last=0,toastTimer=0,sound=true,audio=null;
const mods=[{name:'Cloud Cushion',desc:'Soft landing; sprinting costs extra stamina.',key:'padding'},{name:'Crinkle Pop',desc:'A cheerful rustle gives you a little extra zip.',key:'crinkle'},{name:'Thermal Lock',desc:'Dash heat builds composure faster.',key:'thermal'},{name:'Snug Fit',desc:'Composure rises faster, but recovery works better.',key:'snug'},{name:'Keen Sensors',desc:'Mochi warns you when you’re getting frazzled.',key:'sensors'},{name:'Lucky Stitch',desc:'Tasks give a little extra stamina back.',key:'lucky'},{name:'Bouncy Hem',desc:'A springy step boosts your walking pace.',key:'bouncy'}];
const taskDefs=[['Repair the kite pump','🔧'],['Collect moonberries','🫐'],['Sort the parcel stack','📦'],['Tune the garden bell','🔔'],['Find the lost mitten','🧤'],['Refill the bird bath','💧'],['Polish the brass telescope','🔭'],['Gather picnic napkins','🧺'],['Wake the sleepy windmill','🌬️'],['Deliver a peach tart','🥧'],['Re-pot the tiny fern','🌱'],['Stack the storybooks','📚'],['Untangle the bunting','🎏'],['Pick up the star map','🗺️'],['Mend the park bench','🪡'],['Water the tulip row','🌷'],['Return the toy boat','⛵'],['Sort the shiny buttons','🟡'],['Wind the clockwork fox','🦊'],['Bring tea to the lookout','🍵']];
const player={x:1000,y:690,r:20,face:0,stamina:100,composure:17,soiled:0,steps:0};let tasks=[],completed=0,elapsed=0,remaining=240,prepLeft=60,modsPicked=[],opponents=[],keys={},mobile={},interactHold=false,taskIndex=0,finishCount=0,finishers=[],lastCompanion=0,cam={x:0,y:0};
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function resize(){const r=stage.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);cw=r.width;ch=r.height;canvas.width=Math.floor(cw*dpr);canvas.height=Math.floor(ch*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}window.addEventListener('resize',resize);resize();
function initTasks(){let coords=[];for(let row=0;row<4;row++)for(let col=0;col<5;col++){coords.push({x:260+col*370+rand(-75,75),y:230+row*300+rand(-60,60)})}coords.sort(()=>Math.random()-.5);tasks=taskDefs.map((t,i)=>({...coords[i],name:t[0],icon:t[1],done:false}));player.x=1000;player.y=690;let ordered=[],pool=[...tasks],px=player.x,py=player.y;while(pool.length){pool.sort((a,b)=>Math.hypot(a.x-px,a.y-py)-Math.hypot(b.x-px,b.y-py));let t=pool.shift();ordered.push(t);px=t.x;py=t.y}tasks=ordered;taskIndex=0}
function startDraft(){mode='prep';prepLeft=60;elapsed=0;remaining=240;completed=0;player.stamina=100;player.composure=17;player.soiled=0;modsPicked=[...mods].sort(()=>Math.random()-.5).slice(0,5);initTasks();opponents=Array.from({length:9},(_,i)=>({name:['Pip','Juniper','Biscuit','Nova','Pogo','Clover','Miso','Tumble','Waffle'][i],progress:0,rate:rand(1.05,1.85),finishAt:rand(160,255),finished:false,x:rand(150,1850),y:rand(150,1200),color:['#ff8b79','#9d8bd8','#54b8aa','#e1aa48','#6ba9e8','#ef91bd','#86ae66','#d27f53','#7c9a9d'][i]}));$('raceTitle').textContent='Modification hour';$('phasePill').textContent='PREP';$('phasePill').style.background='#fff0c8';$('phasePill').style.color='#8b6520';renderMods();renderTasks();showPrep();updateHud()}
function showIntro(){mode='intro';overlay.classList.remove('hide');modal.innerHTML=`<div class="modal-kicker">A cozy little race against the clock</div><h1>Diaper<br>Roulette<span style="color:#71caa6">.</span></h1><p>Ten pairs, twenty errands, one very busy afternoon. You’re a Wearer teamed up with Mochi the raccoon. Keep your cool, take a breather at a rest stop, and finish your route before nine other pairs do.</p><div class="intro-grid"><div class="intro-item"><b>🏃 Move & dash</b><span>WASD / arrows to move · hold Shift to dash. Touch controls included.</span></div><div class="intro-item"><b>🧺 Make the rounds</b><span>Get close to each glowing errand and press E (or DO IT).</span></div><div class="intro-item"><b>🌿 Take a breather</b><span>Rest at a green pavilion to lower composure and regain stamina.</span></div><div class="intro-item"><b>🎲 Five surprise rules</b><span>Each run rolls five playful gear mods that change your strategy.</span></div></div><button class="primary" id="startBtn">DRAW TEAMS &nbsp;→</button><p class="small-note">Single-player party race with nine lively AI rivals. A full run takes about 3–4 minutes.</p>`;$('startBtn').onclick=startDraft}
function showPrep(){overlay.classList.remove('hide');const chips=modsPicked.map(m=>`<div class="modifier active"><b>✦ ${m.name}</b>${m.desc}</div>`).join('');modal.innerHTML=`<div class="modal-kicker">Phase 01 · The randomized draft</div><h1>Your team is<br>locked in.</h1><div class="draftline"><div class="avatar">🦝</div><div class="line-copy"><b>You + Mochi</b><br>Wearer & spotter · teammates for the whole race</div><span style="margin-left:auto;font-size:20px">🤝</span></div><p>Five surprise modifications are in! Take a moment to review the rulebook, then jump into the dash whenever you’re ready.</p><div class="modifier-grid">${chips}</div><div class="countdown"><span id="prepTimer">01:00</span> <span style="font:500 10px 'DM Mono';color:#84928f;letter-spacing:.08em">PLANNING WINDOW</span></div><button class="primary" id="runBtn">START THE ERRAND DASH &nbsp;→</button><p class="small-note">The planning window is 60 seconds. You can start early; the race clock begins when you do.</p>`;$('runBtn').onclick=beginRun}
function beginRun(){if(mode!=='prep')return;mode='run';elapsed=0;remaining=240;overlay.classList.add('hide');$('raceTitle').textContent='The Errand Dash';$('phasePill').textContent='LIVE';$('phasePill').style.background='#dff4e9';$('phasePill').style.color='#287458';toast('The dash is on! Mochi’s got your back.');updateHud()}
function showEnd(win,reason){mode='end';overlay.classList.remove('hide');const place=1+opponents.filter(o=>o.finished&&o.finishAt<elapsed).length;const title=win?(place===1?'First place!':'You made the top nine!'):'Time’s up!';const subtitle=win?'Route complete and your team is safe.':reason||'The last train has left the station. Shake it off and try another route!';modal.innerHTML=`<div class="modal-kicker">${win?'A very well-earned victory':'The afternoon got away from you'}</div><h1>${title}</h1><p>${subtitle} ${win?'Mochi says you were a great team.':'Mochi saved you a seat for the next round.'}</p><div class="end-score"><div><b>${completed}/20</b><span>Errands</span></div><div><b>${formatTime(elapsed)}</b><span>Race time</span></div><div><b>${win?'#'+place:'—'}</b><span>Finish</span></div></div><button class="primary" id="againBtn">PLAY ANOTHER ROUND &nbsp;↻</button><p class="small-note">Every round reshuffles the route, rivals and five gear modifications.</p>`;$('againBtn').onclick=startDraft;updateHud()}
function renderMods(){$('modList').innerHTML=modsPicked.length?modsPicked.map(m=>`<span class="mod-chip on">✦ ${m.name}</span>`).join(''):'<span class="mod-chip">Five surprise mods</span>'}
function renderTasks(){const list=$('taskList');list.innerHTML=tasks.map((t,i)=>`<div class="task-row ${t.done?'done':''} ${!t.done&&i===taskIndex?'active':''}" id="task-${i}"><span class="task-icon">${t.done?'✓':t.icon}</span><span>${t.name}</span></div>`).join('');$('taskProgress').textContent=`${tasks.length-completed} left`}
function formatTime(n){n=Math.max(0,Math.floor(n));return `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`}
function updateHud(){ $('taskStat').textContent=`${completed} / 20`;$('timeStat').textContent=formatTime(remaining);$('meterText').textContent=player.composure<35?'Calm':player.composure<65?'Warming up':player.composure<85?'Getting tense':'Take a breather!';$('meter').classList.toggle('urgent',player.composure>68);$('meter').firstElementChild.style.width=`${player.composure}%`;$('staminaText').textContent=`${Math.round(player.stamina)}%`;$('staminaBar').style.width=`${player.stamina}%`;document.querySelectorAll('.task-row').forEach((el,i)=>el.classList.toggle('active',!tasks[i]?.done&&i===taskIndex));$('taskProgress').textContent=`${20-completed} left`}
function toast(msg){const el=$('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2100)}
function ding(freq=620){if(!sound)return;try{audio??=new AudioContext();const o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.frequency.value=freq;g.gain.setValueAtTime(.055,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.17);o.start();o.stop(audio.currentTime+.18)}catch{}}
$('soundBtn').onclick=()=>{$('soundBtn').textContent=sound?'♫ Sound off':'♫ Sound on';sound=!sound};
$('buddyBtn').onclick=()=>{const lines=['“Rest stop at the middle of the park. I’ll keep an eye out!”','“The errands are in a nice loop. We can do this!”','“A short dash is great. Save some stamina for the hills!”','“You’re doing great—let’s keep that composure meter green.”','“I can hear the windmill from here. Bet that’s our next stop!”'];$('buddyTip').textContent=lines[Math.floor(Math.random()*lines.length)];toast('Mochi: '+$('buddyTip').textContent.replace(/[“”]/g,''));};
const rests=[{x:1000,y:690,name:'Picnic Pavilion'},{x:430,y:1040,name:'Willow Rest Stop'},{x:1600,y:310,name:'Windmill Gazebo'}];let restCooldown=0,decor=[];
// Seeded park decoration keeps the landscape calm and consistent as the camera moves.
